<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mirpa_lar_261002</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 640px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p.subtitle {
      color: var(--muted);
      margin-bottom: 32px;
    }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 600;
    }
    ul.team {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    ul.team li {
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.9rem;
    }
    footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>mirpa_lar_261002</h1>
    <p class="subtitle">Projeto hospedado com GitHub Pages</p>
    <h2>Criado por</h2>
    <ul class="team">
      <li>Mariana</li>
      <li>Isabela</li>
      <li>Rhavy</li>
      <li>Pietra</li>
      <li>Antonella</li>
    </ul>
    <footer>mirpa_lar_261002 &mdash; 2026</footer>

</body>
</html>
